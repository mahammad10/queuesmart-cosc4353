<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="dashboard">

<header>
    <p>Welcome</p>
    <h1 id="headerName">...</h1>
</header>

<div class="dashboard-container">

    <h2>User Dashboard</h2>

    <div class="dashboard-grid">

        <div class="dashboard-card">
            <h3>Current Queue Status:</h3>
            <div id="currentQueueStatus"><p>Loading...</p></div>
        </div>

        <div class="dashboard-card">
            <h3>Active Services:</h3>
            <ul id="activeServiceList"><li>Loading...</li></ul>
        </div>

        <div class="dashboard-card">
            <h3>Notifications:</h3>
            <div id="notificationList"><p>Loading...</p></div>
        </div>

    </div>

    <a href="joinQueue.html" class="dashboard-button">Join Queue</a>
    <a href="queueStatus.html" class="dashboard-button">View Queue Status</a>
    <a href="history.html" class="dashboard-button">View Queue History</a>
    <a href="#" class="bottom-link" onclick="doLogout()">LOG OUT</a>

</div>

<script src="api.js"></script>
<script src="script.js"></script>

</body>
</html>
