<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="forgotPassword">

<header>
    <p>Account Recovery</p>
    <h1>Queue Smart</h1>
</header>

<div class="container">

    <div class="login-box">

        <h2>Reset Password</h2>

        <label>EMAIL:</label>

        <p id="message" class="message"></p>

        <button class="login-button" onclick="sendReset()">SEND RESET LINK</button>

        <a href="index.html" class="bottom-link">Back to login</a>

    </div>

</div>

<script src="api.js"></script>
<script src="script.js"></script>

</body>
</html>
