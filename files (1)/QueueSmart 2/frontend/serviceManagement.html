<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="serviceManagement">

<header>
    <p>Admin</p>
    <h1>Queue Smart</h1>
</header>

<div class="dashboard-container">

    <h2 id="formTitle">Add New Service</h2>

    <div class="service-form-card">

        <input type="hidden" id="serviceId" value="">

        <label>Service Name:</label>
        <input type="text" id="serviceName" maxlength="100" placeholder="e.g. Passport Renewal">

        <label>Description:</label>
        <textarea id="serviceDescription" placeholder="Briefly describe this service"></textarea>

        <label>Expected Duration (minutes):</label>
        <input type="number" id="serviceDuration" min="1" placeholder="e.g. 15">

        <label>Priority Level:</label>
        <select id="servicePriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>

        <p id="formMessage" class="message"></p>

        <button class="login-button" onclick="saveService()">SAVE SERVICE</button>

    </div>

    <h2>Existing Services</h2>

    <table class="service-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Duration</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="serviceTableBody"></tbody>
    </table>

    <br>

    <a href="adminDashboard.html" class="bottom-link">Back to Admin Dashboard</a>

</div>

<script src="api.js"></script>
<script src="script.js"></script>

</body>
</html>
